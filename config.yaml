# INbreast Lesion Segmentation Configuration

data:
  # Raw data locations
  dicom_dir: "INbreast_complete/AllDICOMs"
  xml_dir: "INbreast_complete/AllXML"
  csv_path: "INbreast_complete/INbreast.csv"
  pectoral_xml_dir: "INbreast_complete/PectoralMuscle/Pectoral Muscle XML"
  
  # Offline preprocessed cache directory (accelerates training)
  cache_dir: "data/cache"
  use_cache: true

  # Target configuration: "mass" (Mass + Spiculated Region) or "calcification" (Calcification + Cluster)
  target: "mass"

  # Image dimensions and preprocessing
  image_size: 512
  percentile_clip: [0.5, 99.5]
  normalize_imagenet: true
  flip_right_breasts: true
  exclude_pectoral_muscle: false

  # Negative (empty mask) sampling ratio relative to positive samples (e.g. 1.0 means 1:1, or -1 for all negatives)
  negative_ratio: 1.0

  # Cross-validation settings (Patient-grouped stratified 5-fold)
  splits_path: "splits.json"
  n_splits: 5
  seed: 42

augmentation:
  horizontal_flip_prob: 0.5
  shift_scale_rotate_prob: 0.5
  brightness_contrast_prob: 0.5
  gamma_prob: 0.3
  elastic_distortion_prob: 0.2

models:
  backbone: "resnet34"
  encoder_weights: "imagenet"
  in_channels: 3
  classes: 1

training:
  batch_size: 8
  num_workers: 4
  epochs: 100
  patience: 15
  
  # Differential learning rates (encoder vs decoder/head)
  encoder_lr: 0.0001
  decoder_lr: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  mixed_precision: true

  # Loss function settings: "dice_bce", "focal", or "tversky"
  loss_type: "dice_bce"
  dice_weight: 1.0
  bce_weight: 1.0
  focal_gamma: 2.0
  focal_alpha: 0.25
  tversky_alpha: 0.7
  tversky_beta: 0.3

  # Device: "cuda" or "cpu"
  device: "cuda"

evaluation:
  lesion_iou_threshold: 0.2
  threshold_search_start: 0.1
  threshold_search_end: 0.9
  threshold_search_step: 0.05
  debug_overlay_dir: "debug_overlays"
  results_dir: "results"
  visualizations_dir: "visualizations"

